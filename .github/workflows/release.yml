# Publishes a release when a version tag is pushed:
#   git tag -a v0.1.0 -m "mib 0.1.0" && git push origin v0.1.0
# The Linux build comes from the CI workflow run on that tag. It gets a SHA-256 checksum and a
# signed build provenance attestation (gh attestation verify), and the download page is
# refreshed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release
      id-token: write # sign the attestation
      attestations: write
      actions: write # start the Pages workflow
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Name the files for this version and checksum them
        run: |
          mkdir dist
          mv artifacts/mib-linux-x86_64.tar.gz "dist/mib-$GITHUB_REF_NAME-linux-x86_64.tar.gz"
          cd dist && sha256sum mib-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/mib-*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes \
            --title "mib $GITHUB_REF_NAME"
      # Pages only deploys from main, and a release made with the workflow token doesn't
      # trigger other workflows, so start the Pages workflow on main explicitly.
      - name: Refresh the download page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main
