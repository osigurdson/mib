# Unsupported commands don't run their remaining keys

[[case]]
name = "unknown g command"
keys = "gZx"
vim_keys = "x"

[[case]]
name = "unknown z command"
keys = "zqx"
vim_keys = "x"

[[case]]
name = "macro record keys"
keys = "qaA;<Esc>jq2@a"
status = "gap"
note = "Macros are not supported; Jot discards qa, q and @a, so only the plain edits run"

[[case]]
name = "macro run keys"
keys = "@ax"
vim_keys = "x"
status = "gap"

