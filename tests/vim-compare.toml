# Unsupported commands don't run their remaining keys

[[case]]
name = "unknown g command"
keys = "gZx"
vim_keys = "x"

[[case]]
name = "unknown z command"
keys = "zqx"
vim_keys = "x"

[[case]]
name = "macro record keys"
keys = "qaA;<Esc>jq2@a"
vim_keys = "A;<Esc>jA;<Esc>jA;<Esc>"
status = "gap"
note = "Macros are not supported; mib discards qa, q2 and @a. :normal can't record, so vim_keys spells out the result"

[[case]]
name = "macro run keys"
keys = "@ax"
vim_keys = "x"

