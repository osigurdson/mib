# Vim parity cases for tools/vim-compare.py (`make vim-compare`).
#
# Each case types `keys` into mib and into Vim, starting from the same seed with the cursor on
# line 1, column 1, then compares the saved files. Keys use Vim notation: <Esc> <CR> <BS> <Tab>
# <Del> <Up> <Down> <Left> <Right> <Home> <End> <lt> and <C-x>.
#
# Only file contents are compared. For a motion-only case, finish with an edit such as `x` or
# `iX<Esc>` so the cursor position shows up in the file.
#
# `vim_keys` replaces the keys Vim runs. Use it where :normal differs from typing: after a
# failing command, :normal drops the rest of the keys, while interactive Vim beeps and carries on;
# u undoes everything since the start of :normal; and q can't record a macro.
#
# status = "gap" marks a known difference from Vim; add a `note` saying why. The run fails when
# a passing case stops matching or when a gap starts matching (so the status gets updated).

[seeds]
default = """
alpha beta gamma
one two three
foo(bar, baz)
x = 1;
count 7

last para line
end
"""
indented = """
def main():
    first()
    second()

done
"""
long = """
Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
Ut enim ad minim veniam,
quis nostrud exercitation.

    Indented paragraph that is also quite long and should wrap once it passes the seventy-nine column limit.
"""
wrapedge = """
See https://example.com/a/very/long/path/that/keeps/going/and/going/past/the/limit/of/seventy/nine for details.
Café naïve résumé façade déjà vu, café naïve résumé façade déjà vu, café naïve résumé.
trailing spaces here   
and here
"""

